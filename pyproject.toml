[project]
name = "niti"
version = "0.1.0"
description = "Autonomous plain-language civic rights and multilingual voice explainer"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "docling>=2.145.0",
    "pypdf>=6.21.4",
    "qdrant-client[fastembed]>=1.20.0",
    "langgraph>=1.2.19",
    "anthropic>=2.3.0",
    "openai>=3.42.0",
    "groq>=1.7.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = [
    "live: hits real government websites; run with `uv run pytest -m live`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
